services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thermal_intel_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: thermal_intel
      POSTGRES_USER: thermal_user
      POSTGRES_PASSWORD: thermal_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermal_user -d thermal_intel"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
