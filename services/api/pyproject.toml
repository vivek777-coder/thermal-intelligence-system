[project]
name = "thermal-intelligence-api"
version = "0.1.0"
description = "Backend for the Industrial Thermal Intelligence & Emergency Decision-Support Platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
